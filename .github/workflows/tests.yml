name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eb
          POSTGRES_PASSWORD: eb
          POSTGRES_DB: ebtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eb -d ebtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix tests

      - name: Type-check api/
        run: npx tsc -p tests/tsconfig.api.json

      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: node tests/run.mjs

      - name: Keep screenshots from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/.artifacts/
          if-no-files-found: ignore
