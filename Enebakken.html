<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huskeseddel - Enebakken</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap">
    <style>
        :root {
            --bg-a: #7B2D26;
            --bg-b: #5A211C;
            --card-bg: #FFFDF8;
            --paper-edge: #F1E4C8;
            --ink: #2A211D;
            --ink-soft: #71604e;
            --falu: #7B2D26;
            --falu-dark: #5A211C;
            --falu-tint: #F1DAD3;
            --forest: #3B5D42;
            --forest-dark: #2A4531;
            --forest-tint: #DCE7DD;
            --gold: #B4842A;
            --gold-soft: #E4C989;
            --border: #E4D3B0;
            --shadow: rgba(58, 30, 14, 0.28);
            --check-mark: #FBF5E9;
            --horse-body: #7B2D26;
            --horse-saddle: #E4C989;
            --horse-accent: #3B5D42;
            --confetti-blue: #006AA7;
            --confetti-yellow: #FECC02;
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-a: #241914;
                --bg-b: #14100c;
                --card-bg: #2B211A;
                --paper-edge: #3a2c21;
                --ink: #F3E7D6;
                --ink-soft: #c9b8a4;
                --falu: #D97463;
                --falu-dark: #A6493B;
                --falu-tint: #3a2420;
                --forest: #7FAE8C;
                --forest-dark: #55805f;
                --forest-tint: #24332a;
                --gold: #E0B65C;
                --gold-soft: #6b5427;
                --border: #4a3627;
                --shadow: rgba(0, 0, 0, 0.55);
                --check-mark: #241914;
                --horse-body: #D97463;
                --horse-saddle: #6b5427;
                --horse-accent: #7FAE8C;
                color-scheme: dark;
            }
        }
        :root[data-theme="dark"] {
            --bg-a: #241914;
            --bg-b: #14100c;
            --card-bg: #2B211A;
            --paper-edge: #3a2c21;
            --ink: #F3E7D6;
            --ink-soft: #c9b8a4;
            --falu: #D97463;
            --falu-dark: #A6493B;
            --falu-tint: #3a2420;
            --forest: #7FAE8C;
            --forest-dark: #55805f;
            --forest-tint: #24332a;
            --gold: #E0B65C;
            --gold-soft: #6b5427;
            --border: #4a3627;
            --shadow: rgba(0, 0, 0, 0.55);
            --check-mark: #241914;
            --horse-body: #D97463;
            --horse-saddle: #6b5427;
            --horse-accent: #7FAE8C;
            color-scheme: dark;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: radial-gradient(120% 140% at 50% -10%, var(--bg-a) 0%, var(--bg-b) 70%);
            font-family: "Libre Franklin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--ink);
        }

        .plank-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                repeating-linear-gradient(90deg, rgba(0,0,0,0.08) 0 2px, transparent 2px 96px),
                radial-gradient(120% 140% at 50% -10%, var(--bg-a) 0%, var(--bg-b) 70%);
            opacity: 0.9;
        }

        .page {
            max-width: 560px;
            margin: 0 auto;
            padding-inline: 20px;
            padding-block: 40px 56px;
        }

        #confetti-layer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 999;
        }
        .confetti-piece {
            position: absolute;
            top: -20px;
            width: 8px;
            height: 14px;
            border-radius: 2px;
        }

        @media (prefers-reduced-motion: no-preference) {
            .page.shake { animation: screenShake 0.5s ease; }
            @keyframes screenShake {
                0%, 100% { transform: translateX(0) rotate(0); }
                10% { transform: translateX(-9px) rotate(-0.6deg); }
                20% { transform: translateX(8px) rotate(0.6deg); }
                30% { transform: translateX(-7px) rotate(-0.4deg); }
                40% { transform: translateX(6px) rotate(0.4deg); }
                50% { transform: translateX(-5px); }
                60% { transform: translateX(4px); }
                70% { transform: translateX(-3px); }
                80% { transform: translateX(2px); }
                90% { transform: translateX(-1px); }
            }

            .confetti-piece {
                animation-name: confettiFall;
                animation-timing-function: cubic-bezier(0.35, 0.2, 0.6, 1);
                animation-fill-mode: forwards;
            }
            @keyframes confettiFall {
                0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
                100% { transform: translate(var(--drift), 105vh) rotate(var(--rot)); opacity: 0.85; }
            }
        }

        header.hero {
            text-align: center;
            margin-bottom: 22px;
        }

        .hero-icon {
            width: 96px;
            height: 82px;
            margin: 0 auto 6px;
            transform-origin: 50% 92%;
        }

        @media (prefers-reduced-motion: no-preference) {
            .hero-icon { animation: rock 4.5s ease-in-out infinite; }
            @keyframes rock {
                0%, 100% { transform: rotate(-3deg) translateY(0); }
                50% { transform: rotate(3deg) translateY(-2px); }
            }
        }

        h1 {
            font-family: "Caveat", cursive;
            font-weight: 700;
            font-size: 3.1rem;
            line-height: 0.95;
            margin: 4px 0 0;
            color: var(--gold-soft);
            text-shadow: 0 2px 0 rgba(0,0,0,0.25);
        }

        h1 span {
            display: block;
            font-family: "Libre Franklin", sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--gold-soft);
            opacity: 0.85;
            margin-top: 2px;
        }

        .tagline {
            color: var(--gold-soft);
            opacity: 0.75;
            font-style: italic;
            font-size: 0.95rem;
            margin: 8px 0 0;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .tab-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 10px;
            border: 2px solid transparent;
            border-radius: 10px;
            font-family: "Libre Franklin", sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            background-color: rgba(251, 245, 233, 0.14);
            color: var(--gold-soft);
            transition: background-color 0.25s ease, color 0.25s ease, transform 0.15s ease, border-color 0.25s ease;
        }

        .tab-btn svg { flex-shrink: 0; transition: transform 0.3s ease; }
        .tab-btn:active { transform: scale(0.97); }

        .tab-btn.active-close {
            background-color: var(--falu-tint);
            color: var(--falu-dark);
            border-color: var(--gold);
        }
        .tab-btn.active-open {
            background-color: var(--forest-tint);
            color: var(--forest-dark);
            border-color: var(--gold);
        }
        .tab-btn.active-close svg, .tab-btn.active-open svg { transform: scale(1.12); }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--paper-edge);
            border-radius: 4px;
            padding: 26px 22px 22px;
            box-shadow: 0 18px 34px -14px var(--shadow), 0 2px 0 var(--paper-edge);
            transform: rotate(-0.6deg);
            position: relative;
        }

        .pin {
            position: absolute;
            top: -11px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 70%);
            box-shadow: 0 3px 6px rgba(0,0,0,0.35);
        }

        .section-title {
            font-family: "Caveat", cursive;
            font-weight: 700;
            font-size: 1.7rem;
            margin: 0 0 14px;
            padding-bottom: 10px;
            border-bottom: 2px dashed var(--border);
            color: var(--falu);
        }

        #aaben .section-title { color: var(--forest); }

        .task-list { list-style: none; padding: 0; margin: 0; }

        .task-item {
            display: flex;
            align-items: center;
            padding: 11px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
        }
        .task-item:last-child { border-bottom: none; }

        @media (prefers-reduced-motion: no-preference) {
            .tab-content.active .task-item {
                animation: itemIn 0.45s ease both;
                animation-delay: calc(var(--i) * 55ms);
            }
            @keyframes itemIn {
                from { opacity: 0; transform: translateY(7px); }
                to { opacity: 1; transform: none; }
            }
            .tab-content.active {
                animation: panelIn 0.35s ease both;
            }
            @keyframes panelIn {
                from { opacity: 0; transform: translateY(4px); }
                to { opacity: 1; transform: none; }
            }
        }

        .task-item input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            position: relative;
            width: 24px;
            height: 24px;
            margin-right: 14px;
            flex-shrink: 0;
            border: 2px solid var(--gold);
            border-radius: 5px;
            background: var(--card-bg);
            cursor: pointer;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        .task-item input[type="checkbox"]:checked {
            background-color: var(--falu);
            border-color: var(--falu);
        }
        #aaben .task-item input[type="checkbox"]:checked {
            background-color: var(--forest);
            border-color: var(--forest);
        }

        .task-item input[type="checkbox"]::after {
            content: "";
            position: absolute;
            inset: 0;
            clip-path: polygon(21% 46%, 39% 63%, 79% 22%, 90% 33%, 39% 85%, 10% 56%);
            background: var(--check-mark);
            transform: scale(0);
            transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .task-item input[type="checkbox"]:checked::after { transform: scale(1); }

        .task-item label {
            position: relative;
            font-size: 1.03rem;
            cursor: pointer;
            flex: 1;
            transition: color 0.3s ease;
        }

        .task-item label::after {
            content: "";
            position: absolute;
            left: 0;
            right: 100%;
            top: 50%;
            height: 2px;
            background: var(--ink-soft);
            transition: right 0.4s ease;
        }

        .task-item.completed label {
            color: var(--ink-soft);
        }
        .task-item.completed label::after {
            right: 0;
        }

        .reset-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--ink-soft);
            font-family: "Libre Franklin", sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
        }
        .reset-btn:hover { border-color: var(--gold); color: var(--ink); }
        .reset-btn:active { transform: scale(0.98); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .kurbits-divider { width: 100%; height: 14px; display: block; margin-top: 22px; opacity: 0.7; }

        footer.foot-note {
            text-align: center;
            margin-top: 18px;
            font-family: "Caveat", cursive;
            font-size: 1.2rem;
            color: var(--gold-soft);
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="plank-bg"></div>
<div id="confetti-layer" aria-hidden="true"></div>
<div class="page">
    <header class="hero">
        <svg class="hero-icon" viewBox="0 0 140 120" aria-hidden="true">
            <rect x="40" y="82" width="11" height="28" rx="5" fill="var(--horse-body)"/>
            <rect x="58" y="86" width="11" height="24" rx="5" fill="var(--horse-body)"/>
            <rect x="86" y="86" width="11" height="24" rx="5" fill="var(--horse-body)"/>
            <rect x="104" y="82" width="11" height="28" rx="5" fill="var(--horse-body)"/>
            <path d="M118,58 C132,52 134,70 124,78 C119,81 114,76 116,70 Z" fill="var(--horse-body)"/>
            <ellipse cx="78" cy="66" rx="38" ry="24" fill="var(--horse-body)"/>
            <path d="M46,58 C34,44 34,20 54,10 C66,4 76,10 74,22 C72,34 64,40 64,52 C64,60 56,64 46,58 Z" fill="var(--horse-body)"/>
            <path d="M56,12 C54,4 62,2 66,8 C68,12 62,16 56,12 Z" fill="var(--horse-body)"/>
            <ellipse cx="76" cy="54" rx="20" ry="9" fill="var(--horse-saddle)"/>
            <g fill="var(--horse-accent)">
                <circle cx="95" cy="66" r="3"/><circle cx="101" cy="60" r="2"/><circle cx="101" cy="72" r="2"/>
                <circle cx="90" cy="60" r="2"/><circle cx="90" cy="72" r="2"/>
            </g>
            <g fill="var(--horse-accent)">
                <circle cx="60" cy="70" r="2.6"/><circle cx="65" cy="65" r="1.8"/><circle cx="65" cy="75" r="1.8"/>
            </g>
        </svg>
        <h1>Enebakken<span>Tjekliste</span></h1>
        <p class="tagline">Mormors Sverige</p>
    </header>

    <nav class="tabs" role="tablist">
        <button type="button" class="tab-btn" role="tab" aria-selected="false" aria-controls="aaben" onclick="switchTab('aaben', this)">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="4" y="3" width="3" height="18" rx="1" fill="currentColor" opacity="0.92"/><path d="M8 3 L18 6 L18 18 L8 21 Z" fill="currentColor" opacity="0.55"/><circle cx="10.5" cy="12" r="1.1" fill="var(--card-bg)"/></svg>
            Åbn op
        </button>
        <button type="button" class="tab-btn active-close" role="tab" aria-selected="true" aria-controls="luk" onclick="switchTab('luk', this)">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5" fill="currentColor" opacity="0.92"/><circle cx="15" cy="12" r="1.3" fill="var(--card-bg)"/></svg>
            Luk ned
        </button>
    </nav>

    <div class="card">
        <div class="pin" aria-hidden="true"></div>

        <!-- LUK NED SECTION -->
        <div id="luk" class="tab-content active" role="tabpanel">
            <h2 class="section-title">Når huset lukkes ned</h2>
            <ul class="task-list">
                <li class="task-item" style="--i:0" onclick="toggleTask(event, this)">
                    <input type="checkbox" aria-label="Luk for gassen til køleskabet">
                    <label>Luk for gassen til køleskabet</label>
                </li>
                <li class="task-item" style="--i:1" onclick="toggleTask(event, this)">
                    <input type="checkbox" aria-label="Tøm køleskabet og lad det stå åbent">
                    <label>Tøm køleskabet og lad det stå åbent</label>
                </li>
                <li class="task-item" style="--i:2" onclick="toggleTask(event, this)">
                    <input type="checkbox" aria-label="Tøm wc">
                    <label>Tøm wc</label>
                </li>
                <li class="task-item" style="--i:3" onclick="toggleTask(event, this)">
                    <input type="checkbox" aria-label="Sluk for strømmen til wc-blæseren">
                    <label>Sluk for strømmen til wc-blæseren</label>
                </li>
                <li class="task-item" style="--i:4" onclick="toggleTask(event, this)">
                    <input type="checkbox" aria-label="Tøm vand af dunke og indendørs tanke">
                    <label>Tøm vand af dunke og indendørs tanke</label>
                </li>
                <li class="task-item" style="--i:5" onclick="toggleTask(event, this)">
                    <input type="checkbox" aria-label="Støvsug hovedhuset">
                    <label>Støvsug hovedhuset</label>
                </li>
                <li class="task-item" style="--i:6" onclick="toggleTask(event, this)">
                    <input type="checkbox" aria-label="Støvsug annexet">
                    <label>Støvsug annexet</label>
                </li>
                <li class="task-item" style="--i:7" onclick="toggleTask(event, this)">
                    <input type="checkbox" aria-label="Lås huset">
                    <label>Lås huset</label>
                </li>
                <li class="task-item" style="--i:8" onclick="toggleTask(event, this)">
                    <input type="checkbox" aria-label="Lås værksted">
                    <label>Lås værksted</label>
                </li>
                <li class="task-item" style="--i:9" onclick="toggleTask(event, this)">
                    <input type="checkbox" aria-label="Lås anneks">
                    <label>Lås anneks</label>
                </li>
                <li class="task-item" style="--i:10" onclick="toggleTask(event, this)">
                    <input type="checkbox" aria-label="Luk lågen">
                    <label>Luk lågen</label>
                </li>
                <li class="task-item" style="--i:11" onclick="toggleTask(event, this)">
                    <input type="checkbox" aria-label="Fyld brændekurve">
                    <label>Fyld brændekurve</label>
                </li>
                <li class="task-item" style="--i:12" onclick="toggleTask(event, this)">
                    <input type="checkbox" aria-label="Fortæl ved lejlighed hvad der er taget af husets madlager">
                    <label>Fortæl ved lejlighed hvad der er taget af husets madlager</label>
                </li>
            </ul>
            <button type="button" class="reset-btn" onclick="resetCheckboxes('luk')">Nulstil lukke-listen</button>
        </div>

        <!-- ÅBN OP SECTION -->
        <div id="aaben" class="tab-content" role="tabpanel">
            <h2 class="section-title">Når huset åbnes op</h2>
            <ul class="task-list">
                <li class="task-item" style="--i:0" onclick="toggleTask(event, this)">
                    <input type="checkbox" aria-label="Åbn for gassen til køleskabet og tænd det">
                    <label>Åbn for gassen til køleskabet og tænd det</label>
                </li>
                <li class="task-item" style="--i:1" onclick="toggleTask(event, this)">
                    <input type="checkbox" aria-label="Tænd for strømmen til wc-blæseren">
                    <label>Tænd for strømmen til wc-blæseren</label>
                </li>
                <li class="task-item" style="--i:2" onclick="toggleTask(event, this)">
                    <input type="checkbox" aria-label="Gør wc klart til brug">
                    <label>Gør wc klart til brug</label>
                </li>
                <li class="task-item" style="--i:3" onclick="toggleTask(event, this)">
                    <input type="checkbox" aria-label="Fyld vand på dunke og tanke">
                    <label>Fyld vand på dunke og tanke</label>
                </li>
            </ul>
            <button type="button" class="reset-btn" onclick="resetCheckboxes('aaben')">Nulstil åbne-listen</button>
        </div>

        <svg class="kurbits-divider" viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true">
            <defs>
                <pattern id="kb1" width="40" height="20" patternUnits="userSpaceOnUse">
                    <path d="M0,10 C6,2 14,2 20,10 C26,18 34,18 40,10" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="10" cy="5" r="1.8" fill="var(--falu)"/>
                    <circle cx="30" cy="15" r="1.8" fill="var(--forest)"/>
                </pattern>
            </defs>
            <rect width="200" height="20" fill="url(#kb1)"/>
        </svg>
    </div>

    <footer class="foot-note">Välkommen hem</footer>
</div>

<script>
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => {
            el.classList.remove('active-close', 'active-open');
            el.setAttribute('aria-selected', 'false');
        });

        document.getElementById(tabId).classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        btn.classList.add(tabId === 'luk' ? 'active-close' : 'active-open');
    }

    function toggleTask(event, element) {
        const checkbox = element.querySelector('input[type="checkbox"]');
        if (event.target !== checkbox) {
            checkbox.checked = !checkbox.checked;
        }
        element.classList.toggle('completed', checkbox.checked);

        const container = element.closest('.tab-content');
        if (checkbox.checked && container) {
            const boxes = container.querySelectorAll('input[type="checkbox"]');
            const allChecked = Array.from(boxes).every(box => box.checked);
            if (allChecked) celebrate();
        }
    }

    function celebrate() {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        const page = document.querySelector('.page');
        page.classList.remove('shake');
        void page.offsetWidth;
        page.classList.add('shake');
        setTimeout(() => page.classList.remove('shake'), 500);

        const layer = document.getElementById('confetti-layer');
        const colors = ['var(--confetti-blue)', 'var(--confetti-yellow)'];
        for (let i = 0; i < 40; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = (Math.random() * 100) + '%';
            piece.style.backgroundColor = colors[i % 2];
            piece.style.animationDuration = (0.9 + Math.random() * 0.8) + 's';
            piece.style.animationDelay = (Math.random() * 0.25) + 's';
            piece.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
            piece.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
            layer.appendChild(piece);
        }
        setTimeout(() => { layer.innerHTML = ''; }, 2200);
    }

    function resetCheckboxes(containerId) {
        const container = document.getElementById(containerId);
        container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.checked = false;
            cb.closest('.task-item').classList.remove('completed');
        });
    }
</script>

</body>
</html>
