<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huskeseddel - Enebakken</title>
    <style>
        :root {
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --border: #e2e8f0;
            --open-color: #2e7d32;
            --close-color: #c62828;
            --done-color: #a0aec0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #e2e8f0;
            color: #4a5568;
        }

        .tab-btn.active-close {
            background-color: var(--close-color);
            color: white;
        }

        .tab-btn.active-open {
            background-color: var(--open-color);
            color: white;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: var(--text);
        }

        .task-item label {
            font-size: 1.05rem;
            cursor: pointer;
            flex: 1;
        }

        .task-item.completed label {
            text-decoration: line-through;
            color: var(--done-color);
        }

        .reset-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
        }

        .reset-btn:active {
            background: #edf2f7;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Enebakken Tjekliste</h1>

    <div class="tabs">
        <button class="tab-btn active-close" onclick="switchTab('luk')">🔒 Luk ned</button>
        <button class="tab-btn" onclick="switchTab('aaben')">🔓 Åbn op</button>
    </div>

    <div class="card">
        <!-- LUK NED SECTION -->
        <div id="luk" class="tab-content active">
            <h2 class="section-title">Når huset lukkes ned</h2>
            <ul class="task-list">
                <li class="task-item" onclick="toggleTask(this)">
                    <input type="checkbox">
                    <label>Luk for gassen til køleskabet</label>
                </li>
                <li class="task-item" onclick="toggleTask(this)">
                    <input type="checkbox">
                    <label>Tøm køleskabet og lad det stå åbent</label>
                </li>
                <li class="task-item" onclick="toggleTask(this)">
                    <input type="checkbox">
                    <label>Tøm wc</label>
                </li>
                <li class="task-item" onclick="toggleTask(this)">
                    <input type="checkbox">
                    <label>Sluk for strømmen til wc-blæseren</label>
                </li>
                <li class="task-item" onclick="toggleTask(this)">
                    <input type="checkbox">
                    <label>Tøm vand af dunke og indendørs tanke</label>
                </li>
                <li class="task-item" onclick="toggleTask(this)">
                    <input type="checkbox">
                    <label>Støvsug hovedhuset</label>
                </li>
                <li class="task-item" onclick="toggleTask(this)">
                    <input type="checkbox">
                    <label>Støvsug annexet</label>
                </li>
                <li class="task-item" onclick="toggleTask(this)">
                    <input type="checkbox">
                    <label>Lås huset</label>
                </li>
                <li class="task-item" onclick="toggleTask(this)">
                    <input type="checkbox">
                    <label>Lås værksted</label>
                </li>
                <li class="task-item" onclick="toggleTask(this)">
                    <input type="checkbox">
                    <label>Lås anneks</label>
                </li>
                <li class="task-item" onclick="toggleTask(this)">
                    <input type="checkbox">
                    <label>Luk lågen</label>
                </li>
            </ul>
            <button class="reset-btn" onclick="resetCheckboxes('luk')">Nulstil lukke-listen</button>
        </div>

        <!-- ÅBN OP SECTION -->
        <div id="aaben" class="tab-content">
            <h2 class="section-title">Når huset åbnes op</h2>
            <ul class="task-list">
                <li class="task-item" onclick="toggleTask(this)">
                    <input type="checkbox">
                    <label>Åbn for gassen til køleskabet og tænd det</label>
                </li>
                <li class="task-item" onclick="toggleTask(this)">
                    <input type="checkbox">
                    <label>Tænd for strømmen til wc-blæseren</label>
                </li>
                <li class="task-item" onclick="toggleTask(this)">
                    <input type="checkbox">
                    <label>Gør wc klart til brug</label>
                </li>
                <li class="task-item" onclick="toggleTask(this)">
                    <input type="checkbox">
                    <label>Fyld vand på dunke og tanke</label>
                </li>
            </ul>
            <button class="reset-btn" onclick="resetCheckboxes('aaben')">Nulstil åbne-listen</button>
        </div>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => {
            el.classList.remove('active-close', 'active-open');
        });

        document.getElementById(tabId).classList.add('active');
        
        const btn = event.currentTarget;
        if (tabId === 'luk') {
            btn.classList.add('active-close');
        } else {
            btn.classList.add('active-open');
        }
    }

    function toggleTask(element) {
        const checkbox = element.querySelector('input[type="checkbox"]');
        if (event.target !== checkbox) {
            checkbox.checked = !checkbox.checked;
        }
        element.classList.toggle('completed', checkbox.checked);
    }

    function resetCheckboxes(containerId) {
        const container = document.getElementById(containerId);
        container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.checked = false;
            cb.closest('.task-item').classList.remove('completed');
        });
    }
</script>

</body>
</html>
