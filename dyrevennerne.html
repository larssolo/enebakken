<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#284b3a">
<meta name="robots" content="noindex">
<title>Dyrevennerne</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:#17261e;color:#f7f0dc;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
svg{display:block}
:root{
 --forest:#284b3a;--forest-dark:#173328;--moss:#71865a;--cream:#f7f0dc;--paper:#fffaf0;
 --red:#c0544a;--red-dark:#873a36;--gold:#e8b93a;--blue:#6f96a0;--ink:#29372e;--shade:#344b3c33;
}
#game{position:relative;width:100vw;height:100vh;height:100dvh;max-width:600px;margin:auto;overflow:hidden;background:#9bb9ad}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;z-index:30}
.screen.on{display:flex}
.screen:before{
 content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;
 background-image:radial-gradient(circle at 10px 12px,#294b3a 0 1px,transparent 1.5px),radial-gradient(circle at 30px 34px,#f7f0dc 0 1px,transparent 1.5px);
 background-size:44px 44px;
}

/* ---- shared buttons ---- */
.bigbtn{
 display:inline-flex;align-items:center;justify-content:center;gap:10px;
 border:3px solid var(--red-dark);border-bottom:7px solid var(--red-dark);border-radius:14px;
 background:var(--red);color:#fffaf0;padding:13px 26px;font-size:20px;font-weight:900;letter-spacing:.3px;
 box-shadow:0 6px 0 #49322955;margin:6px;min-width:230px
}
.bigbtn svg{width:22px;height:22px;flex:none}
.bigbtn:active{transform:translateY(4px);border-bottom-width:3px}
.bigbtn.green{background:#4f7a45;border-color:#2f4f2a}
.bigbtn.light{background:var(--paper);color:var(--forest-dark);border-color:#5b705f}
.iconbtn{
 position:relative;width:48px;height:48px;border:2px solid #3e5748;border-radius:12px;background:#f7f0dcee;
 color:var(--forest-dark);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 3px var(--shade);flex:none
}
.iconbtn svg{width:24px;height:24px}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px var(--shade)}
.corner{position:absolute;top:max(14px,env(safe-area-inset-top));z-index:50}
.corner.left{left:14px}.corner.right{right:14px}
.embedded-only{display:none!important}
html.embedded .embedded-only{display:flex!important}
.chip{
 display:flex;align-items:center;gap:7px;background:#f7f0dce8;border:2px solid #52634f;border-radius:12px;
 padding:7px 13px;font-weight:900;font-size:18px;color:var(--forest-dark);box-shadow:0 3px var(--shade)
}
.chip svg{width:22px;height:22px}

/* ---- menu ---- */
#menu{background:linear-gradient(#b7d0c6 0 46%,#8da889 46% 70%,#667b55 70% 100%)}
/* The sky block's bottom edge sits a little above the 46% horizon, so the
   title never lands on the line whatever the screen height; the start
   button and the scores stand on the meadow below it. */
.menu-sky{position:absolute;left:0;right:0;bottom:54%;padding:0 12px 16px;display:flex;flex-direction:column;align-items:center;z-index:2}
.menu-ground{position:absolute;left:0;right:0;top:calc(46% + 22px);display:flex;flex-direction:column;align-items:center;z-index:2}
.logo{display:flex;gap:6px;align-items:flex-end;justify-content:center;filter:drop-shadow(0 5px 0 #31503c2e)}
.logo svg{width:70px;height:70px;animation:bob 1.7s ease-in-out infinite}
.logo svg:nth-child(2){width:80px;height:80px;animation-delay:.22s}
.logo svg:nth-child(3){animation-delay:.44s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(4deg)}}
.title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(36px,11vw,60px);line-height:1;text-align:center;margin:10px 0 6px;color:var(--forest-dark);font-weight:900;letter-spacing:.5px;text-shadow:0 2px #fff7}
.subtitle{text-align:center;font-size:16px;font-weight:800;color:#31483a}
.statsrow{display:flex;gap:9px;margin-top:12px}
.sun{position:absolute;top:max(22px,calc(env(safe-area-inset-top) + 12px));left:18px;width:70px;height:70px;animation:spin 18s linear infinite;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;width:100px;height:40px;opacity:.55;animation:cloud 26s linear infinite;pointer-events:none;z-index:1}
@keyframes cloud{from{transform:translateX(-140px)}to{transform:translateX(720px)}}
.deco{position:absolute;pointer-events:none;z-index:1}

/* ---- level select ---- */
#levels{background:linear-gradient(#a9c5bb,#cbd7bb 53%,#778d61);padding:0 16px max(16px,env(safe-area-inset-bottom))}
.levelTitle{font-family:Georgia,serif;font-size:clamp(28px,8.4vw,36px);font-weight:900;color:var(--forest-dark);margin:calc(max(14px,env(safe-area-inset-top)) + 58px) 0 2px}
.levelSub{font-weight:800;color:#38503e;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.levelSub .chip{font-size:15px;padding:4px 10px}.levelSub .chip svg{width:18px;height:18px}
.grid{width:100%;max-width:480px;display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.level{
 position:relative;border:3px solid #48604e;border-radius:14px;background:var(--paper);color:var(--forest-dark);
 padding:8px 6px;min-height:clamp(92px,17dvh,142px);box-shadow:0 6px 0 #344b3c44;font-weight:900;font-size:15px;line-height:1.15;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px
}
.level .face{width:clamp(40px,8.5dvh,58px);height:clamp(40px,8.5dvh,58px)}
.level .stars{display:flex;gap:2px}.level .stars svg{width:20px;height:20px}
.level.locked{background:#e3e3d6;color:#6d7a6c;border-color:#8a9687}
.level.locked .face{filter:grayscale(1) opacity(.45)}
.level .lockbadge{position:absolute;top:6px;right:6px;width:26px;height:26px}
.level:not(.locked):active{transform:translateY(4px);box-shadow:0 2px #344b3c44}
.level.fresh{animation:glow 1.4s ease-in-out 3}
@keyframes glow{50%{box-shadow:0 0 0 6px #f4c54288,0 6px 0 #344b3c44}}

/* ---- play ---- */
#play{background:linear-gradient(#a8c8bd 0 30%,#c7d7b3 30% 63%,#77905f 63% 100%)}
#play[data-level="2"]{background:linear-gradient(#a9cfd4 0 30%,#c9dcc0 30% 58%,#7fa8b0 58% 100%)}
#play[data-level="4"]{background:linear-gradient(#3e4d73 0 30%,#6c7a8f 30% 63%,#4d6246 63% 100%)}
#play[data-level="5"]{background:linear-gradient(#f2c486 0 30%,#e7d7a8 30% 63%,#8c9658 63% 100%)}
#play:after{
 content:"";position:absolute;left:-10%;right:-10%;bottom:-4%;height:34%;pointer-events:none;
 background:radial-gradient(ellipse at 12% 80%,#58724e 0 18%,transparent 18.5%),radial-gradient(ellipse at 42% 82%,#607b52 0 23%,transparent 23.5%),radial-gradient(ellipse at 78% 85%,#536d49 0 25%,transparent 25.5%)
}
#arena{position:absolute;inset:0;z-index:1;touch-action:none}
.tree{position:absolute;bottom:16%;width:76px;height:130px;opacity:.72;pointer-events:none}
.scene{position:absolute;inset:0;pointer-events:none;display:none}
#play[data-level="2"] .scene.pond,#play[data-level="3"] .scene.party,#play[data-level="4"] .scene.night,#play[data-level="5"] .scene.king{display:block}
.pond:after{content:"";position:absolute;left:8%;right:8%;bottom:9%;height:15%;border-radius:50%;background:#6f96a0;box-shadow:inset 0 6px 0 #9fc1c7,0 0 0 5px #5d7f63}
.pond:before{content:"";position:absolute;z-index:1;left:24%;bottom:15%;width:34px;height:13px;border-radius:50%;background:#71865a;box-shadow:140px 16px 0 #71865a,78px -9px 0 -3px #8fbd6a}
#play[data-level="2"] .tree{display:none}
.night i{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff6c9;box-shadow:0 0 8px #fff6c9;animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25;transform:scale(.6)}}
#hud{position:absolute;top:0;left:0;right:0;z-index:12;padding:max(10px,env(safe-area-inset-top)) 12px 6px;display:flex;flex-direction:column;gap:9px}
.hudrow{display:flex;align-items:center;gap:8px}
.pill{
 display:flex;align-items:center;gap:5px;background:#f7f0dcee;color:var(--forest-dark);border:2px solid #526a59;border-radius:12px;
 padding:6px 10px;font-size:18px;font-weight:900;box-shadow:0 3px var(--shade);min-height:44px
}
.pill svg{width:22px;height:22px;flex:none}
.hearts{margin:0 auto;gap:3px}.hearts svg{width:24px;height:24px}
.hearts.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
#timePill.hurry{background:#f6d4cc;border-color:var(--red-dark);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#mission{
 display:flex;align-items:center;gap:9px;background:#fffaf0ee;color:var(--forest-dark);border:2px solid #687b63;border-radius:12px;
 padding:6px 10px;box-shadow:0 4px 12px #31473525;width:100%;max-width:440px;align-self:center
}
#mission .micon{width:38px;height:38px;flex:none}
#mission .mmain{flex:1;min-width:0}
#mission .mtext{font-weight:900;font-size:16px}
.bar{height:10px;border-radius:6px;background:#dfe3cf;border:2px solid #9aa892;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(#f4c542,#e0a92e);transition:width .25s ease-out}
#mission .mcount{font-weight:900;font-size:17px;min-width:44px;text-align:right}
#mission.done{border-color:#4f7a45;background:#eef6dd}
#mission.done .bar i{background:linear-gradient(#8cc56d,#5f9a4c)}

.animal{position:absolute;left:0;top:0;width:var(--size,110px);height:var(--size,110px);margin:calc(var(--size,110px)/-2) 0 0 calc(var(--size,110px)/-2);pointer-events:none;z-index:5;display:none;will-change:transform}
.animal.in,.animal.leave,.animal.caught{display:block}
.animal .body{width:100%;height:100%;transform-origin:50% 90%;filter:drop-shadow(0 7px 0 #30463430)}
.animal .body svg{width:100%;height:100%}
.animal.in .body{animation:popin .28s cubic-bezier(.3,1.7,.5,1) both,wiggle 1.2s .28s ease-in-out infinite}
.animal.leave .body{animation:hopout .23s ease-in both}
.animal.caught .body{animation:caught .34s ease-out both}
@keyframes popin{from{transform:scale(.15) translateY(30%);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:translateY(-5%) rotate(-4deg)}50%{transform:rotate(0)}75%{transform:translateY(-5%) rotate(4deg)}}
@keyframes hopout{to{transform:translateY(-30%) scale(.2);opacity:0}}
@keyframes caught{40%{transform:scale(1.3) rotate(-10deg)}100%{transform:scale(.1) rotate(25deg);opacity:0}}

#fx{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.spark{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;animation:spark .7s ease-out forwards}
.spark svg{width:100%;height:100%}
@keyframes spark{from{transform:translate(0,0) scale(.5) rotate(0)}to{transform:translate(var(--x),var(--y)) scale(1.1) rotate(var(--r));opacity:0}}
.poptxt{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:28px;white-space:nowrap;color:#fff3b0;letter-spacing:.5px;
 text-shadow:2px 0 #263c2d,-2px 0 #263c2d,0 2px #263c2d,0 -2px #263c2d,2px 2px #263c2d,-2px -2px #263c2d,2px -2px #263c2d,-2px 2px #263c2d,0 4px 0 #263c2d80;
 animation:poptxt .8s ease-out forwards}
.poptxt.near{color:#d9f1f5;font-size:24px}
.poptxt.miss{color:#ffd0c9;font-size:26px}
@keyframes poptxt{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:21;pointer-events:none;text-align:center;opacity:0;
 background:#fffaf0;color:var(--forest-dark);border:3px solid #4f7a45;border-radius:16px;padding:12px 18px;box-shadow:0 10px 30px #1a2c2140;width:max-content;max-width:88%}
#banner b{display:block;font-size:26px;font-family:Georgia,serif}
#banner span{font-weight:800;font-size:16px}
#banner.show{animation:banner 2.1s ease-out forwards}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.95)}}

/* ---- pause & end ---- */
.overlay{background:#203a2dc4;justify-content:center;z-index:40;padding:16px}
@supports (backdrop-filter:blur(4px)){.overlay{background:#203a2da8;backdrop-filter:blur(4px)}}
.card{
 position:relative;width:min(100%,440px);max-height:100%;overflow:auto;background:var(--paper);color:var(--forest-dark);border:3px solid #526a59;
 border-radius:18px;padding:20px 16px;text-align:center;box-shadow:0 20px 50px #172a204d;display:flex;flex-direction:column;align-items:center
}
.card h2{font-family:Georgia,serif;font-size:30px;margin:4px 0 2px}
.card p{font-size:17px;font-weight:800;margin:4px 0}
.card .big{width:84px;height:84px}
.result{display:flex;align-items:center;gap:8px;font-size:44px;font-weight:900;color:var(--red-dark);line-height:1.1}
.result svg{width:44px;height:44px}.result #finalUnit{font-size:26px;color:var(--forest-dark)}
.endstars{display:flex;gap:6px;margin:6px 0}
.endstars svg{width:46px;height:46px}
.endstars .got{animation:starin .5s cubic-bezier(.3,1.8,.5,1) both}
@keyframes starin{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.unlocked{display:none;align-items:center;gap:8px;background:#eef6dd;border:2px dashed #4f7a45;border-radius:12px;padding:6px 12px;margin:6px 0;font-weight:900}
.unlocked.on{display:flex}.unlocked svg{width:30px;height:30px}
.cardrow{display:flex;gap:10px;margin-top:6px;justify-content:center}

#confetti{position:absolute;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.conf{position:absolute;top:-30px;width:13px;height:13px;border:2px solid #5b704f;animation:fall 1.7s linear forwards}
@keyframes fall{to{top:110%;transform:rotate(540deg)}}

@media (max-height:520px){
 .logo svg{width:48px;height:48px}.logo svg:nth-child(2){width:54px;height:54px}
 .title{font-size:34px;margin:4px 0}.subtitle{display:none}.sun{display:none}
 .menu-ground{top:calc(46% + 8px)}.bigbtn{padding:9px 20px;font-size:18px}
}
@media (max-width:350px){
 .pill{padding:5px 7px;font-size:16px;gap:3px}.pill svg{width:19px;height:19px}.hearts svg{width:20px;height:20px}
 .hudrow{gap:5px}.iconbtn{width:44px;height:44px}.bigbtn{min-width:0}
}
@media (prefers-reduced-motion:reduce){
 .logo svg,.sun,.cloud,.night i{animation:none}
 .animal.in .body{animation:popin .2s ease-out both}
}
</style>
</head>

// ------------------------------------------------------------ progress
const STORE_KEY = 'dyrevennerne:v1';
function loadProgress() {

  const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');

  return {

   best: Math.max(0, s.best | 0),

}

}
let freshlyUnlocked = -1;

  const locked = i + 1 > progress.unlocked;
  const b = document.createElement('button');

  b.setAttribute('aria-label', `${i + 1}. ${l.name}${locked ? ' (låst)' : `, ${progress.stars[i]} stjerner`}`);

// ---------------------------------------------------------------- play
const arena = $('arena'), animalEl = $('animal'), animalBody = animalEl.firstElementChild, fx = $('fx');
const round = { level: 0, score: 0, progress: 0, lives: 3, combo: 0, phase: 'idle', endAt: 0, pausedAt: 0, graceUntil: 0, lastHeartLoss: -1e9, lastSecs: -1, clock: 0, missionDone: false };

const animal = { kind: null, x: 0, y: 0, state: 'none', gen: 0, timer: 0, spawnTimer: 0 };
const geom = { w: 0, h: 0, top: 0, size: 110 };

function measure() {

}
function setAnimalClass(state) {

 if (state) { void animalEl.offsetWidth; animalEl.className = 'animal ' + state; }
}
function clearAnimalTimers() { clearTimeout(animal.timer); clearTimeout(animal.spawnTimer); }
function hideAnimal() { clearAnimalTimers(); animal.gen++; animal.state = 'none'; setAnimalClass(''); }

function spawnSoon(ms) { clearTimeout(animal.spawnTimer); animal.spawnTimer = setTimeout(spawn, ms); }
function spawn() {
 if (round.phase !== 'playing') return;
 const L = LEVELS[round.level], s = geom.size;
 let kind = pick(L.animals);
 if (kind === animal.kind) kind = pick(L.animals);                // a little more variety
 const minX = s * .55, maxX = geom.w - s * .55;
 const minY = geom.top + s * .55, maxY = Math.max(minY + 40, geom.h * .86 - s * .5);

 let x, y, tries = 0;
 do { x = rand(minX, maxX); y = rand(minY, maxY); }
 while (++tries < 16 && animal.kind && Math.hypot(x - animal.x, y - animal.y) < minJump);

 const gen = ++animal.gen;
 animalEl.style.setProperty('--size', s + 'px');
 animalEl.style.transform = `translate3d(${x}px,${y}px,0)`;
 animalBody.innerHTML = icon(kind);

 animal.timer = setTimeout(() => leave(gen), stay);
}
function leave(gen) {

 setAnimalClass('leave');

}

function onArenaDown(e) {

 e.preventDefault();

}
function catchAnimal() {
 const L = LEVELS[round.level], gen = animal.gen, kind = animal.kind;
 clearTimeout(animal.timer);
 animal.state = 'caught';
 setAnimalClass('caught');
 round.score++; round.combo++;
 if (L.kind === 'count' || kind === L.kind) round.progress++;
 updateHud();
 Sound.catch(kind, round.combo);
 vibrate(15);
 burst(animal.x, animal.y);
 popText(round.combo >= 3 && round.combo % 3 === 0 ? pick(CHEERS) : VOICE_WORD[kind], animal.x, animal.y - geom.size * .5, '');

}
function nearMiss(x, y) { popText('Tæt på!', x, y - 16, 'near'); Sound.near(); }
function miss(x, y) {

 // A burst of wild taps costs one heart, not all three at once.

 popText('Hov!', x, y - 16, 'miss');

 if (round.lives <= 0) finish();
}
function missionComplete() {

 $('mission').classList.add('done');
 const b = $('banner'); b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');

}

function updateHud() {
 const L = LEVELS[round.level];
 $('score').textContent = round.score;
 $('hearts').innerHTML = [0, 1, 2].map((i) => icon(i < round.lives ? 'heart' : 'heart-empty')).join('');
 const p = Math.min(round.progress, L.target);
 $('missionCount').textContent = `${p}/${L.target}`;
 $('missionBar').style.width = (100 * p / L.target) + '%';
}
function tick() {
 if (round.phase !== 'playing') return;
 const left = Math.max(0, round.endAt - now()), secs = Math.ceil(left / 1000);
 if (secs !== round.lastSecs) {
  round.lastSecs = secs;
  $('time').textContent = secs;
  const hurry = secs <= 5 && secs > 0;
  $('timePill').classList.toggle('hurry', hurry);
  if (hurry) Sound.tick(secs);

}

function startLevel(i) {
 const L = LEVELS[i];
 clearInterval(round.clock); hideAnimal();
 Object.assign(round, { level: i, score: 0, progress: 0, lives: 3, combo: 0, phase: 'playing', missionDone: false, lastSecs: -1, lastHeartLoss: -1e9 });
 $('play').dataset.level = i;
 $('missionText').textContent = L.mission;
 $('missionIcon').setAttribute('href', '#i-' + (L.kind === 'count' ? 'paw' : L.kind));
 $('mission').classList.remove('done');
 $('timePill').classList.remove('hurry');
 $('time').textContent = L.time;
 $('banner').classList.remove('show');
 fx.innerHTML = '';
 show('play');
 updateHud(); measure();

 round.graceUntil = now() + 800;               // a double-tap on the level card mustn't cost a heart

}
function pause() {

}
function resume() {
 if (round.phase !== 'paused') return;

}
function finish() {

 clearInterval(round.clock); hideAnimal();
 const i = round.level, L = LEVELS[i], complete = round.progress >= L.target;
 // Stars only for a completed mission; extra catches earn the 2nd and 3rd.
 const stars = complete ? 1 + (round.score >= L.target + 3) + (round.score >= L.target + 6) : 0;
 if (stars > progress.stars[i]) progress.stars[i] = stars;
 let unlockedNow = false;
 if (complete && i + 1 < LEVELS.length && progress.unlocked < i + 2) { progress.unlocked = i + 2; unlockedNow = true; freshlyUnlocked = i + 1; }
 if (round.score > progress.best) progress.best = round.score;
 saveProgress();

 $('endIcon').setAttribute('href', '#i-' + (complete ? 'trophy' : L.icon));
 $('endTitle').textContent = complete ? 'MISSION KLARET!' : (round.lives <= 0 ? 'Åh nej, hjerterne slap op!' : 'Godt forsøgt!');
 $('finalScore').textContent = round.score;
 $('missionResult').textContent = complete ? `Du klarede: ${L.mission.toLowerCase()}` : `Du nåede ${Math.min(round.progress, L.target)} af ${L.target}. Prøv igen!`;

 starsEl.innerHTML = [0, 1, 2].map(() => icon('star-empty')).join('');

  for (let s = 0; s < stars; s++) setTimeout(() => {

   const el = starsEl.children[s]; if (!el) return;

}
function quitToLevels() { round.phase = 'idle'; clearInterval(round.clock); hideAnimal(); renderLevels(); show('levels'); }

// ------------------------------------------------------------- effects

  s.innerHTML = icon(kinds[i % kinds.length]);

  s.style.setProperty('--x', rand(-80, 80) + 'px');
  s.style.setProperty('--y', rand(-95, 45) + 'px');

}

}

on('quitBtn', quitToLevels);
on('replayBtn', () => startLevel(round.level));
on('nextBtn', () => startLevel(Math.min(round.level + 1, LEVELS.length - 1)));
on('levelsBtn', quitToLevels);
document.querySelectorAll('.soundbtn').forEach((b) => b.addEventListener('click', () => {
 progress.sound = !progress.sound; saveProgress(); renderSoundButtons();
 if (progress.sound) { Sound.unlock(); Sound.click(); }
}));
document.querySelectorAll('[data-action="close"]').forEach((b) => b.addEventListener('click', () => tellParent('close')));
arena.addEventListener('pointerdown', onArenaDown);
$('hud').addEventListener('pointerdown', (e) => e.stopPropagation());
document.addEventListener('keydown', (e) => {
 if (e.key === 'Escape') { if (embedded) tellParent('close'); else if (round.phase === 'playing') pause(); }
});
// A hidden tab (phone locked, app switched) pauses the round instead of
// letting the clock run out unseen.
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('resize', () => {
 if (round.phase !== 'playing') return;
 measure();
 if (animal.state === 'in') {
  animal.x = Math.min(Math.max(animal.x, geom.size * .55), geom.w - geom.size * .55);
  animal.y = Math.min(Math.max(animal.y, geom.top + geom.size * .55), geom.h * .86);
  animalEl.style.transform = `translate3d(${animal.x}px,${animal.y}px,0)`;
 }
});

renderMenu(); renderSoundButtons(); renderLevels();
tellParent('ready');
})();
</script>
</body>
</html>
